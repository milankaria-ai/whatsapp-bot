<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Media Grid - Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-top: 20px; }
        input, textarea, button { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #38bdf8; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
        button:hover { background: #0ea5e9; }
        .logo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid #38bdf8; display: block; margin: 0 auto 10px auto; }
        .hidden { display: none !important; }
        .chat-box { max-height: 300px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 5px; margin-top: 10px; }
        .msg { padding: 8px; margin: 5px 0; border-radius: 4px; }
        .incoming { background: #334155; }
        .outgoing { background: #0369a1; text-align: right; }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div id="loginSection" class="container">
        <img src="logo.png" alt="Logo" class="logo">
        <h2 style="text-align: center; color: #38bdf8;">Apex Media Grid Login</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <input type="password" id="passwordInput" placeholder="Enter Admin Password" required autofocus>
            <button type="submit">Login</button>
        </form>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="container hidden">
        <div style="text-align: center;">
            <img src="logo.png" alt="Logo" class="logo">
            <h2 style="color: #38bdf8; margin: 5px 0;">Apex Media Grid Dashboard</h2>
            <p style="color: #22c55e; font-weight: bold;">Status: Connected & Online</p>
        </div>

        <h3>Send Message / Register Client</h3>
        <form id="msgForm" onsubmit="sendMessage(event)">
            <input type="text" id="clientName" placeholder="Client Name (from form)" required>
            <input type="text" id="clientJid" placeholder="Client WhatsApp Number (e.g. 9198888xxxxx@s.whatsapp.net)" required>
            <textarea id="clientMessage" rows="3" placeholder="Type your message here..." required></textarea>
            <button type="submit">Send Message</button>
        </form>

        <h3>Live Inbox</h3>
        <div id="inbox" class="chat-box">
            <!-- Messages will appear here with names -->
        </div>
    </div>

    <script>
        const socket = io();

        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('passwordInput').value;
            // Simple password check (change 'admin123' as desired)
            if (pass === 'admin123') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                loadMessages();
            } else {
                alert('Wrong Password!');
            }
        }

        function sendMessage(e) {
            e.preventDefault();
            const name = document.getElementById('clientName').value;
            const jid = document.getElementById('clientJid').value;
            const message = document.getElementById('clientMessage').value;

            fetch('/send-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jid, name, message })
            }).then(res => res.json()).then(data => {
                if (data.success) {
                    // Blank the input boxes cleanly after sending as requested
                    document.getElementById('clientName').value = '';
                    document.getElementById('clientJid').value = '';
                    document.getElementById('clientMessage').value = '';
                    document.getElementById('clientName').focus();
                } else {
                    alert('Failed to send message.');
                }
            });
        }

        socket.on('new_message', function(msg) {
            appendMessage(msg);
        });

        function loadMessages() {
            fetch('/messages').then(res => res.json()).then(messages => {
                const inbox = document.getElementById('inbox');
                inbox.innerHTML = '';
                messages.forEach(msg => appendMessage(msg));
            });
        }

        function appendMessage(msg) {
            const inbox = document.getElementById('inbox');
            const div = document.createElement('div');
            div.className = `msg ${msg.type}`;
            div.innerHTML = `<strong>${msg.name}</strong>[cite: 14]: ${msg.text} <br><small style="font-size:10px; color:#94a3b8;">${msg.time}</small>`;
            inbox.appendChild(div);
            inbox.scrollTop = inbox.scrollHeight;
        }

        // Allow Enter key submission cleanly across fields
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && document.activeElement.tagName === 'INPUT') {
                // Form handles submit naturally via onsubmit
            }
        });
    </script>
</body>
</html>
