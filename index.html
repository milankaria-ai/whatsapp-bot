<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Media Grid - WhatsApp Bot Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
            margin-bottom: 10px;
        }
        h1 {
            color: #38bdf8;
            margin: 5px 0;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .status {
            color: #22c55e;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- Apex Media Grid Logo -->
        <img src="logo.png.jpg" alt="Apex Media Grid Logo" class="logo">
        <h1>Apex Media Grid</h1>
        <p>Official WhatsApp Bot Dashboard</p>
    </div>

    <div class="card">
        <h2>Bot Status</h2>
        <p>Connection: <span class="status">Connected & Online</span></p>
        <p>Platform: Render Cloud</p>
    </div>

</body>
</html>
